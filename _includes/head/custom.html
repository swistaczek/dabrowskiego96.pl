<!-- SEO Tags -->
{% seo %}

<!-- Local SEO Meta Tags -->
<meta name="geo.region" content="PL-WP">
<meta name="geo.placename" content="Poznań">
<meta name="geo.position" content="52.414194;16.895194">
<meta name="ICBM" content="52.414194, 16.895194">

<!-- Additional Open Graph -->
<meta property="og:locale" content="pl_PL">
<meta property="og:site_name" content="Wspólnota Mieszkaniowa Dąbrowskiego 96">

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

<!-- JSON-LD Structured Data for Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResidentialComplex",
  "name": "Wspólnota Mieszkaniowa Dąbrowskiego 96",
  "alternateName": "Dąbrowskiego 96",
  "url": "https://dabrowskiego96.pl",
  "logo": "https://dabrowskiego96.pl/assets/images/logo.png",
  "image": "https://dabrowskiego96.pl/assets/images/budynek-front.jpg",
  "description": "{{ site.description | strip_html | strip_newlines | escape }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Dąbrowskiego 96",
    "addressLocality": "Poznań",
    "addressRegion": "Wielkopolskie",
    "postalCode": "60-529",
    "addressCountry": "PL"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 52.414194,
    "longitude": 16.895194
  },
  "areaServed": {
    "@type": "Place",
    "name": "Jeżyce, Poznań"
  },
  "sameAs": [
    "https://instagram.com/dabrowskiego96",
    "https://www.facebook.com/groups/dabrowskiego96"
  ]
}
</script>

<!-- Breadcrumbs JSON-LD -->
{% if page.url != "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Strona główna",
      "item": "https://dabrowskiego96.pl"
    }
    {% if page.title %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | escape }}",
      "item": "https://dabrowskiego96.pl{{ page.url }}"
    }
    {% endif %}
  ]
}
</script>
{% endif %}

<!-- Page-specific JSON-LD for Tender pages -->
{% if page.url contains "przetarg" and page.url != "/przetargi/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Tender",
  "name": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "url": "https://dabrowskiego96.pl{{ page.url }}",
  "publisher": {
    "@type": "Organization",
    "name": "Wspólnota Mieszkaniowa Dąbrowskiego 96"
  },
  "datePublished": "{{ page.date | default: site.time | date_to_xmlschema }}"
}
</script>
{% endif %}

<!-- News Article JSON-LD for blog posts -->
{% if page.layout == "single" and page.categories %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}",
  "image": "https://dabrowskiego96.pl{{ page.image | default: '/assets/images/budynek-front.jpg' }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Organization",
    "name": "Wspólnota Mieszkaniowa Dąbrowskiego 96"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Wspólnota Mieszkaniowa Dąbrowskiego 96",
    "logo": {
      "@type": "ImageObject",
      "url": "https://dabrowskiego96.pl/assets/images/logo.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://dabrowskiego96.pl{{ page.url }}"
  }
}
</script>
{% endif %}
